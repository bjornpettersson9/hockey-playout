<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hockey Playout Bord</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: twee plakvelden bovenaan, daaronder per SWITCH-tijd een raster van wedstrijdblokken */
:root{--bg:#f3f5f4;--panel:#fff;--fg:#14201b;--muted:#5d6b65;--line:#d5ddd9;--accent:#0b7a55;--liveu:#1f5fbf;--wmt:#9a5b00;--smart:#7a3fb0;--warn:#b3261e;
--display:"Inter",system-ui,sans-serif;--mono:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--panel:#18211e;--fg:#e4ece8;--muted:#93a39c;--line:#2b3833;--accent:#3ccf95;--liveu:#7fb0ff;--wmt:#f0b45a;--smart:#c99bf0;--warn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--panel:#18211e;--fg:#e4ece8;--muted:#93a39c;--line:#2b3833;--accent:#3ccf95;--liveu:#7fb0ff;--wmt:#f0b45a;--smart:#c99bf0;--warn:#ff8a80;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
main{max-width:1400px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:24px}
h1{font-size:28px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.inputs{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;min-width:0}
textarea{width:100%;box-sizing:border-box;min-height:130px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px;white-space:pre;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:600 14px var(--display);border-radius:4px;padding:7px 12px;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0}
.switch{display:grid;gap:12px}
.switch-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.switch-head b{font:600 22px var(--mono)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;min-width:0;align-content:start}
.top{display:flex;align-items:center;gap:8px}
.top .nr{margin-left:auto}
.eng{font:600 13px var(--mono);border:1px solid currentColor;border-radius:3px;padding:2px 6px}
.nr{font:600 20px var(--mono);color:var(--muted)}
.teams{font-size:19px;font-weight:700;line-height:1.2}
.teams span{color:var(--muted);font-weight:400}
.ops{font-size:16px;font-weight:600}
.ops.none{color:var(--warn);font-weight:400;font-size:13px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin:0}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.extra{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.liveu{color:var(--liveu)}.wmt{color:var(--wmt)}.smart{color:var(--smart)}
.checks{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.checks label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;user-select:none}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent);color:var(--accent)}
.checks label:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.card.ok{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.ok .teams::after{content:" \2713";color:var(--accent)}
.double{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--fg);color:var(--panel);border-radius:3px;padding:2px 5px}
</style>
<main>
  <header><h1>Hockey Playout Bord</h1><p class="hint" id="sub"></p></header>
  <section class="inputs">
    <div class="box">
      <h2>Schema (alle rondes)</h2>
      <textarea id="tsv" spellcheck="false" aria-label="Plak hier de schema-rijen"></textarea>
      <p class="hint">Kopieer de rijen uit de schema-Excel en plak ze hier.</p>
    </div>
    <div class="box">
      <h2>Operators (deze week)</h2>
      <textarea id="ops" spellcheck="false" aria-label="Plak hier de operator-rijen"></textarea>
      <p class="hint">Kopieer het hele operatorblad (Cmd+A, Cmd+C) en plak het hier. Gekoppeld op ENG-nummer.</p>
    </div>
  </section>
  <div class="row">
    <label for="day" class="hint">Dag</label><select id="day"></select>
    <button id="clear">Beide velden leegmaken</button>
    <button id="reset">Vinkjes van deze dag wissen</button>
    <span class="hint" id="progress"></span>
    <span class="hint" id="sync" role="status"></span>
  </div>
  <section id="out" style="display:grid;gap:28px"></section>
</main>
<script>
const SAMPLE = "RONDE 05\t \t \tTHE SWITCH\t12:35\t \t \t \t\t\t\t\t\t\t\t\t\t0\t\nzondag, oktober 18, 2026\tRotterdam D1\tKampong D1\t \t \t12:45\t14:25\tENG 1 Double\t\t\tLiveU 45351\tLIVEU EMGNL_MMH1_CH4\t1\t\t\t1\t1\t1\t\nzondag, oktober 18, 2026\tSCHC D1\tHurley D1\t \t \t12:45\t14:25\tENG 2\t\t\tLiveU 49137\tLIVEU EMGNL_MMH1_CH1\t2\t\t\t2\t2\t2\t\nzondag, oktober 18, 2026\tVictoria D1\tPinok\u00e9 D1\t \t \t12:45\t14:25\tENG 3\t\t\tLiveU 49140\tLIVEU EMGNL_MMH1_CH2\t3\t\t\t3\t3\t3\t\nzondag, oktober 18, 2026\tAmsterdam D1\tDen Bosch D1\t \t \t12:45\t14:25\tENG 4\t\t\tLiveU 49143\tLIVEU EMGNL_MMH1_CH3\t4\t\t\t4\t4\t4\t\nzondag, oktober 18, 2026\tBloemendaal D1\tHDM D1\t \t \t12:45\t14:25\tENG 5\t\t\tWMT 4561\tWMT PLAYOUT 19618-3\t5\t\t\t5\t5\t5\t\nzondag, oktober 18, 2026\tOranje-Rood D1\tHGC D1\t \t \t12:45\t14:25\tSmart 1 Double\t\t\t\t\t6\t\t\t6\t\tSMART\t\n \t \t \tTHE SWITCH\t14:50\t \t \t\t\t\t\t\t\t\t\t\t\t\t\nzondag, oktober 18, 2026\tRotterdam H1\tSCHC H1\t \t \t15:00\t16:40\tENG 1 Double\t\t\tLiveU 45351\tLIVEU EMGNL_MMH1_CH4\t1\t\t\t1\t\t0\t\nzondag, oktober 18, 2026\tHDM H1\tBloemendaal H1\t \t \t15:00\t16:40\tENG 6\t\t\tWMT 4463\tWMT PLAYOUT 19618-4\t2\t\t\t2\t6\t6\t\nzondag, oktober 18, 2026\tSchaerweijde H1\tAmsterdam H1\t \t \t15:00\t16:40\tENG 7\t\t\tWMT 4465\tWMT PLAYOUT 9735-1\t3\t\t\t3\t7\t7\t\nzondag, oktober 18, 2026\tPinok\u00e9 H1\tDen Bosch H1\t \t \t15:00\t16:40\tENG 8\t\t\tWMT 4464\tWMT PLAYOUT 9735-2\t4\t\t\t4\t8\t8\t\nzondag, oktober 18, 2026\tTilburg H1\tKampong H1\t \t \t15:00\t16:40\tENG 9\t\t\tWMT 130183\tWMT PLAYOUT 9735-3\t5\t\t\t5\t9\t9\t\nzondag, oktober 18, 2026\tOranje-Rood H1\tKlein Zwitserland H1\t \t \t15:00\t16:40\tSmart 1 Double\t\t\t\t\t6\t\t\t6\t\tSMART\n";
const SAMPLE_OPS = "\t\tHockey ENG 18-10-2026\n\t\tWedstrijd:\t\tInpaktijd:\tSet nummer:\tKenteken:\t\tWMT/LiveU:\tKanaal\tTelefoon:\nZondag 18-10-2026\nENG 1\t\tDubbel - Rotterdam\t\t7:30\t15\tT-382-SP\t\tLiveU 45351\tLIVEU EMGNL_MMH1_CH4\t1\tJeroen Los\nENG 2\t\tSCHC - Hurley\t\t7:30\t16\tT-383-SP\t\tLiveU 49137\tLIVEU EMGNL_MMH1_CH1\t2\tElise Eijkhout\nENG 3\t\tVictoria - Pinoke\t\t7:30\t18\tT-384-SP\t\tLiveU 49140\tLIVEU EMGNL_MMH1_CH2\t3\tMauren Siemons\nENG 4\t\tAmsterdam - Den Bosch\t\t7:45\t19\tT-385-SP\t\tLiveU 49143\tLIVEU EMGNL_MMH1_CH3\t4\tCarmen Oudshoorn\nENG 5\t\tBloemendaal - HDM\t\t7:30\t23\tT-387-SP\t\tWMT 4561\tWMT PLAYOUT 19618-3\t5\tJamo Detmers\nENG 6\t\tHDM - Bloemendaal\t\t9:30\t27\tT-540-SP\t\tWMT 4463\tWMT PLAYOUT 19618-4\t6\tSanne Veenstra\nENG 7\t\tSchaerweijde - Amsterdam\t\t10:15\t35\tT-388-SP\t\tWMT 4465\tWMT PLAYOUT 9735-1\t7\tBart van het Loo\tJack Burnaby Lautier\nENG 8\t\tPinoke - Den Bosch\t\t10:00\t24\tT-456-SP\t\tWMT 4464\tWMT PLAYOUT 9735-2\t8\tJoris Kammenga\nENG 9\t\tTilburg - Kampong\t\t9:15\t25\tT-386-SP\t\tWMT 130183\tWMT PLAYOUT 9735-3\t9\tJoel Verhaar\nEXTRA Zondag 18-10:\nENG 2\t\tSCHC - Hurley\t\t\tGlasvezelset 1\t\t\t2x Quadcon 300M\nENG 7\t\tSchaerweijde - Amsterdam\t\t\tGlasvezelset 2\t\t\t2x Quadcon 300M\nENG 8\t\tPinoke - Den Bosch\t\t\tGlasvezelset 3\t\t\t2x Quadcon 300M\nENG 9\t\tTilburg - Kampong\t\t\tGlasvezelset 4\t\t\t2x Quadcon 300M";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

// "zondag, oktober 18, 2026" / "18 oktober 2026" / "18-10-2026" -> "2026-10-18"
function dayKey(s){
  s=(s||'').toLowerCase();
  let m=s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if (m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const EN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let mi=MONTHS.findIndex(n=>s.includes(n.slice(0,3))); if(mi<0) mi=EN.findIndex(n=>s.includes(n));
  const y=s.match(/\d{4}/), d=s.replace(/\d{4}/,'').match(/\d{1,2}/);
  return mi>=0&&y&&d ? y[0]+'-'+String(mi+1).padStart(2,'0')+'-'+d[0].padStart(2,'0') : '';
}
const CHECKS=['Audio','Video','Intercom'];
// Gedeeld via db: vinkjes in "checks/<wedstrijd>", geplakte data in "shared/input". Zonder db: alleen deze browser.
let checks={}, db=null, inputDoc=null, inputExists=false, lastSent=null, sendTimer=null;
const cid = key => key.normalize('NFD').replace(/[^A-Za-z0-9_.:@+~-]/g,'_').slice(0,190);
const status = t => { $('sync').textContent=t; };
function localLoad(){ try{checks=JSON.parse(localStorage.getItem('checks'))||{}}catch(e){} }
function localSave(){ if(!db) try{localStorage.setItem('checks',JSON.stringify(checks))}catch(e){} }
function writeFailed(e){ status(e?.code==='invalid_argument'?'Je kunt hier alleen meekijken; wijzigingen worden niet opgeslagen.':e?.code==='quota_exceeded'?'Opslag is vol: '+e.message:'Opslaan mislukt, probeer het opnieuw.'); }
const engNr = s => (String(s).match(/eng\s*(\d+)/i)||[])[1];
const hhmm = v => /^\d*\.\d+$/.test(v) ? (m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0'))(Math.round(v*1440)) : v;

function parseSchedule(text){
  const groups=[]; let cur=null, round='';
  for (const line of text.split(/\r?\n/)){
    const c=line.split('\t').map(s=>s.trim());
    if (/switch/i.test(c[3]||'')){ if(c[0]) round=c[0]; cur={round,time:c[4]||'',matches:[]}; groups.push(cur); continue; }
    if (!c[1]||!c[2]||!dayKey(c[0])) continue;
    if (!cur){ cur={round,time:'',matches:[]}; groups.push(cur); }
    cur.matches.push({key:[dayKey(c[0]),cur.time,c[7],c[1]].join('|'),date:c[0],day:dayKey(c[0]),home:c[1],away:c[2],start:c[5],end:c[6],eng:c[7]||'',link:c[10]||'',kanaal:c[11]||'',nr:c[12]||'',code:c[17]||''});
  }
  groups.forEach(g=>g.day=g.matches[0]?.day||'');
  return groups;
}

// Operatorblad: kolommen tellen vanaf de cel met "ENG n", zodat het niet uitmaakt waar de selectie begint.
function parseOps(text){
  const byEng={}; let day='', extra=false;
  for (const line of text.split(/\r?\n/)){
    const c=line.split('\t').map(s=>s.trim());
    if (!day) day=c.map(dayKey).find(Boolean)||'';
    if (c.some(v=>/^extra/i.test(v))) { extra=true; continue; }
    const i=c.findIndex(v=>/^eng\s*\d+$/i.test(v));
    if (i<0) continue;
    const n=engNr(c[i]), o=byEng[n]||(byEng[n]={extra:[]});
    if (extra){ o.extra.push(c.slice(i+1).filter(Boolean).slice(1).join(' · ')); continue; }
    Object.assign(o,{wedstrijd:c[i+2],inpak:hhmm(c[i+4]||''),set:c[i+5],kenteken:c[i+6],link:c[i+8],kanaal:c[i+9],tel:c[i+10],names:c.slice(i+11).filter(Boolean)});
  }
  return {day,byEng};
}

function kind(m){ return /smart/i.test(m.eng+m.code)?'smart':/^wmt/i.test(m.link)?'wmt':/^liveu/i.test(m.link)?'liveu':''; }

let lastDays='';
function render(){
  const text=$('tsv').value, opsText=$('ops').value;
  if(!db) try{localStorage.setItem('tsv',text);localStorage.setItem('ops',opsText)}catch(e){}
  const groups=parseSchedule(text), ops=parseOps(opsText);
  const days=[...new Set(groups.map(g=>g.day).filter(Boolean))];
  const sel=$('day');
  if (days.join()!==lastDays){
    lastDays=days.join();
    const keep=sel.value;
    sel.innerHTML='<option value="">Alle dagen</option>'+days.map(d=>'<option value="'+d+'">'+d.split('-').reverse().join('-')+'</option>').join('');
    sel.value=days.includes(keep)?keep:days.includes(ops.day)?ops.day:'';
  }
  const shown=groups.filter(g=>g.matches.length&&(!sel.value||g.day===sel.value));
  const n=shown.reduce((a,g)=>a+g.matches.length,0);
  const opsCount=Object.keys(ops.byEng).length;
  $('sub').textContent=n
    ? n+' wedstrijden'+(opsCount?' · operators van '+(ops.day?ops.day.split('-').reverse().join('-'):'onbekende dag')+' ('+opsCount+' ENG)':' · nog geen operators geplakt')
    : 'Geen wedstrijden gevonden. Plak rijen uit de schema-Excel.';
  const all=shown.flatMap(g=>g.matches), okN=all.filter(m=>CHECKS.every(c=>checks[cid(m.key)]?.[c])).length;
  $('progress').textContent=all.length?okN+' van '+all.length+' wedstrijden compleet':'';
  $('out').innerHTML=shown.map(g=>{
    const useOps=opsCount&&(!ops.day||ops.day===g.day);
    return `<div class="switch">
      <div class="switch-head"><h2>${esc(g.round||'The Switch')}</h2><b>${esc(g.time)}</b><span class="hint">${esc(g.matches[0].date)} · ${g.matches.length} wedstrijden</span></div>
      <div class="grid">${g.matches.map(m=>card(m,useOps?ops.byEng[engNr(m.eng)]:null,useOps)).join('')}</div>
    </div>`}).join('');
}

function card(m,o,useOps){
  const k=kind(m), dbl=/double/i.test(m.eng), done=checks[cid(m.key)]||{};
  const ok=CHECKS.every(c=>done[c]);
  const row=(l,v,cls='')=>v?`<dt>${l}</dt><dd class="${cls}">${esc(v)}</dd>`:'';
  const ops = o&&o.names?.length ? `<div class="ops">${o.names.map(esc).join(' &amp; ')}</div>`
    : useOps&&k!=='smart' ? '<div class="ops none">Geen operator gevonden voor deze ENG</div>' : '';
  return `<article class="card${ok?' ok':''}">
    <div class="top"><span class="eng ${k}">${esc(m.eng.replace(/\s*double/i,'')||'—')}</span>${dbl?'<span class="double">Double</span>':''}<span class="nr">${esc(m.nr)}</span></div>
    <div class="teams">${esc(m.home)} <span>–</span> ${esc(m.away)}</div>
    ${ops}
    <dl class="meta">
      ${row('Tijd',m.start&&m.start+'–'+m.end)}
      ${row('Lijn',m.link||(k==='smart'?'SMART':''),k)}
      ${row('Kanaal',m.kanaal)}
      ${o?row('Inpaktijd',o.inpak)+row('Set',o.set)+row('Kenteken',o.kenteken)+row('Telefoon',o.tel):''}
    </dl>
    ${o?.extra?.length?'<div class="extra">Extra: '+o.extra.map(esc).join('<br>')+'</div>':''}
    <div class="checks">${CHECKS.map(c=>`<label><input type="checkbox" data-key="${esc(m.key)}" data-check="${c}"${done[c]?' checked':''}>${c}</label>`).join('')}</div>
  </article>`;
}

let s1=null,s2=null; try{s1=localStorage.getItem('tsv');s2=localStorage.getItem('ops')}catch(e){}
$('tsv').value=s1??SAMPLE; $('ops').value=s2??SAMPLE_OPS;
localLoad();

function queueInput(){
  render();
  if(!db) return;
  clearTimeout(sendTimer);
  sendTimer=setTimeout(async()=>{
    const data={tsv:$('tsv').value,ops:$('ops').value};
    sendTimer=null; lastSent=data.tsv+'\u0000'+data.ops;
    try{ await (inputExists?inputDoc.update(data):inputDoc.set(data)); inputExists=true; status('Opgeslagen voor iedereen met de link.'); }
    catch(e){ writeFailed(e); }
  },800);
}
$('tsv').addEventListener('input',queueInput); $('ops').addEventListener('input',queueInput);
$('day').onchange=render;

$('out').addEventListener('change',async e=>{
  const t=e.target; if(!t.dataset.key) return;
  const id=cid(t.dataset.key), had=!!checks[id];
  (checks[id]||(checks[id]={day:t.dataset.key.split('|')[0]}))[t.dataset.check]=t.checked;
  localSave(); render();
  document.querySelector('[data-key="'+CSS.escape(t.dataset.key)+'"][data-check="'+t.dataset.check+'"]')?.focus();
  if(!db) return;
  const ref=db.collection('checks').doc(id);
  try{ await (had?ref.update({[t.dataset.check]:t.checked}):ref.set(checks[id])); }
  catch(err){ writeFailed(err); }
});

let resetArmed=false;
$('reset').onclick=async()=>{
  if(!resetArmed){ resetArmed=true; $('reset').textContent='Klik nogmaals om te wissen'; setTimeout(()=>{resetArmed=false;$('reset').textContent='Vinkjes van deze dag wissen'},4000); return; }
  resetArmed=false; $('reset').textContent='Vinkjes van deze dag wissen';
  const d=$('day').value, ids=Object.keys(checks).filter(k=>!d||checks[k].day===d);
  ids.forEach(k=>delete checks[k]); localSave(); render();
  if(db) for(const k of ids){ try{ await db.collection('checks').doc(k).delete(); }catch(e){ writeFailed(e); break; } }
};
$('clear').onclick=()=>{$('tsv').value='';$('ops').value='';queueInput();$('tsv').focus()};
render();

(async()=>{
  try{ db=await window.claude?.use?.('db') ?? null; }catch(e){ db=null; }
  if(!db){ status('Alleen in deze browser opgeslagen.'); return; }
  status('Verbinden…');
  inputDoc=db.doc('shared/input');
  inputDoc.onSnapshot(snap=>{
    inputExists=snap.exists;
    if(!snap.exists){ status('Gedeeld. Plak het schema en het operatorblad om te beginnen.'); return; }
    const d=snap.data(), key=d.tsv+'\u0000'+d.ops;
    const typing=[$('tsv'),$('ops')].includes(document.activeElement)&&sendTimer;
    if(key!==lastSent&&!typing){ $('tsv').value=d.tsv||''; $('ops').value=d.ops||''; render(); }
    status('Gedeeld: iedereen met de link ziet dezelfde data en vinkjes.');
  },e=>status('Verbinding met gedeelde opslag verbroken.'));
  // ponytail: max 1000 wedstrijden met vinkjes; per dag filteren (where day==) als het seizoen groter wordt
  db.collection('checks').limit(1000).onSnapshot(snap=>{
    checks={}; snap.docs.forEach(d=>checks[d.id]=d.data()); render();
  },e=>status('Verbinding met gedeelde opslag verbroken.'));
})();
</script>
